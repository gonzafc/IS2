name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install bandit multimetric pytest-cov pydocstyle
      - name: Lint with ruff (targeted)
        run: python -m ruff check src/IS2_T3_C5_IA/IS2_T3_C5_IA --exclude src/IS2_T3_C5_IA/IS2_T3_C5_IA/legacy || (echo "ruff failed" && exit 1)
      - name: Format check with black
        run: black --check .
      - name: Docstring check (PEP257)
        run: |
          pydocstyle src/IS2_T3_C5_IA/IS2_T3_C5_IA/backlog_calculator.py src/IS2_T3_C5_IA/IS2_T3_C5_IA/__init__.py src/IS2_T3_C5_IA/IS2_T3_C5_IA/tests/conftest.py || true
      - name: Type check with mypy
        run: mypy .
      - name: Type check with PyRight
        uses: actions/setup-node@v4
      - name: Install PyRight
        run: |
          npm install -g pyright
      - name: Run PyRight
        run: pyright src || true
      - name: Security scan with Bandit
        run: bandit -r src/IS2_T3_C5_IA/IS2_T3_C5_IA -x src/IS2_T3_C5_IA/IS2_T3_C5_IA/legacy -ll || true
      - name: Metrics (multimetric)
        run: multimetric src/IS2_T3_C5_IA/IS2_T3_C5_IA || true
      - name: Run tests with coverage
        run: pytest -q --cov=src/IS2_T3_C5_IA/IS2_T3_C5_IA --cov-report=term
